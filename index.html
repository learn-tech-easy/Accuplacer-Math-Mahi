<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mahi's ACCUPLACER Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: answer-sheet app — navy test-booklet header band, cool paper body, scantron bubbles, bottom tab bar sized for iPad touch. */
:root{
  --ink:#13213f; --ink-2:#2a3a5f; --paper:#f3f5fa; --card:#ffffff; --line:#d9deea; --muted:#5d6883;
  --gold:#f2b705; --gold-ink:#5b4300; --gold-soft:#fff3c4;
  --band:#0f2a5c; --band-2:#163a7a; --on-band:#ffffff; --on-band-dim:#b9c6e4;
  --ok:#11845b; --ok-soft:#dcf3e9; --bad:#c2352b; --bad-soft:#fbe3e0; --warn:#b26b00; --warn-soft:#fff0d6;
  --bubble:#ffffff; --focus:#2f6bff;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e8ecf6; --ink-2:#c3cbe0; --paper:#0b1428; --card:#13203d; --line:#26365c; --muted:#93a0bf;
  --gold:#f5c537; --gold-ink:#f5c537; --gold-soft:#3a3010;
  --band:#0a1f47; --band-2:#12306a; --on-band:#ffffff; --on-band-dim:#9fb0d8;
  --ok:#3fcf95; --ok-soft:#0f3a2b; --bad:#ff7a6e; --bad-soft:#45191a; --warn:#ffb547; --warn-soft:#3d2a0b;
  --bubble:#0f1a33; --focus:#7ea6ff; color-scheme:dark; } }
:root[data-theme="dark"]{
  --ink:#e8ecf6; --ink-2:#c3cbe0; --paper:#0b1428; --card:#13203d; --line:#26365c; --muted:#93a0bf;
  --gold:#f5c537; --gold-ink:#f5c537; --gold-soft:#3a3010;
  --band:#0a1f47; --band-2:#12306a; --on-band:#ffffff; --on-band-dim:#9fb0d8;
  --ok:#3fcf95; --ok-soft:#0f3a2b; --bad:#ff7a6e; --bad-soft:#45191a; --warn:#ffb547; --warn-soft:#3d2a0b;
  --bubble:#0f1a33; --focus:#7ea6ff; color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.2px}

/* header band */
.band{background:linear-gradient(180deg,var(--band),var(--band-2));color:var(--on-band);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:4px solid var(--gold)}
.band .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:1px;text-transform:uppercase}
.brand b span{color:var(--gold)}
.brand small{font-size:12px;color:var(--on-band-dim);letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
.count{margin-left:auto;display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;white-space:nowrap}
.count .n{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--gold);line-height:1}
.count .l{font-size:12px;color:var(--on-band-dim);text-transform:uppercase;letter-spacing:1px;line-height:1.1}

main{padding-block:20px 120px}
.sec[hidden]{display:none!important}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:14px 22px;font-weight:700;font-size:17px;min-height:52px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gold);color:#241a00}
.btn.navy{background:var(--band);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}

/* today hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.today{background:var(--band);color:#fff;border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:18px solid rgba(242,183,5,.18)}
.today .tag{display:inline-block;background:var(--gold);color:#241a00;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:6px;padding:3px 8px}
.today h2{font-size:34px;font-weight:800;margin:12px 0 6px;color:#fff}
.today p{margin:0 0 16px;color:#c9d4ee;max-width:46ch}
.today .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.today .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.done-note{display:flex;gap:8px;align-items:center;color:#9de7c7;font-weight:700;margin-bottom:12px}

/* gauge */
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge svg{width:190px;max-width:100%;height:auto}
.gauge .big{font-family:var(--f-display);font-weight:800;font-size:44px;fill:var(--ink)}
.gauge .sub{font-size:12px;fill:var(--muted);letter-spacing:1px}
.gauge .verdict{font-weight:700;margin-top:4px}
.gauge small{color:var(--muted);font-size:13px;max-width:30ch}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.stat .k{font-size:13px;color:var(--muted)}

/* topic heat */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tp{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-height:92px}
.tp:hover{border-color:var(--ink-2)}
.tp .nm{font-weight:700;font-size:15px;line-height:1.25}
.tp .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:auto}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-new{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.strand-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.strand-h h3{font-size:24px;font-weight:700}
.strand-h span{font-size:13px;color:var(--muted)}

/* plan */
.week{margin-bottom:22px}
.week h3{font-size:20px;font-weight:700;margin-bottom:8px}
.day{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
.day .dt{font-family:var(--f-display);line-height:1}
.day .dt b{display:block;font-size:26px;font-weight:800}
.day .dt span{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.day .what{min-width:0}
.day .what b{display:block}
.day .what small{color:var(--muted);font-size:14px}
.day.is-today{border:2px solid var(--gold);background:var(--gold-soft)}
.day.is-past:not(.is-done){opacity:.7}
.day.exam{background:var(--band);color:#fff;border-color:var(--band)}
.day.exam .dt span,.day.exam small{color:#c9d4ee}
.mark{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.is-done .mark{background:var(--ok);border-color:var(--ok);color:#fff}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qtop .lbl{font-weight:700}
.qtop .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qnum{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.qtext{font-size:22px;line-height:1.55;margin-bottom:22px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 16px;min-height:62px;font-size:19px}
.opt:hover:not([disabled]){border-color:var(--ink-2)}
.bub{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;background:var(--bubble);color:var(--ink-2)}
.opt.sel{border-color:var(--band-2)} .opt.sel .bub{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.ot{min-width:0;overflow-wrap:anywhere}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;font-size:17px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)} .fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b{font-family:var(--f-display);font-size:21px;display:block;margin-bottom:4px}
.tutor-out{margin-top:12px;white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:16px}
.qactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.qactions .btn{flex:1 1 200px}

.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 2px;font-size:.88em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* results */
.score-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score-hero .pct{font-family:var(--f-display);font-weight:800;font-size:76px;line-height:.9}
.score-hero .msg{flex:1 1 260px;min-width:0}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv:first-child{border-top:none}
.rv .h{display:flex;gap:10px;align-items:flex-start}
.rv .q{font-size:17px;min-width:0;overflow-wrap:anywhere}
.rv .a{font-size:15px;margin-top:6px;color:var(--muted)}
.rv .a b{color:var(--ink)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--ink-2)}
.mode h3{font-size:24px;font-weight:700}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mode.rec{border:2px solid var(--gold)}
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist td,.hist th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.tbl{overflow-x:auto}

.tips{margin:0;padding-left:20px} .tips li{margin-bottom:6px}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;background:var(--card);color:var(--ink);resize:vertical}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);margin-bottom:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:none;background:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.4px;position:relative}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:40}
.toast.show{opacity:1}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.qtext{font-size:19px}.opt{font-size:17px}.today h2{font-size:28px}.count .n{font-size:24px}.brand b{font-size:21px}.day{grid-template-columns:60px 1fr auto}}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="brand"><b>Accuplacer <span>Math</span></b><small>Mahi · MCVSD admission · Goal 90%+</small></div>
    <div class="count" id="countdown" aria-live="polite"><span class="n num" id="cd-n">37</span><span class="l">days to<br>Nov 20</span></div>
  </div>
</header>

<main class="wrap">
  <section class="sec" id="s-today"></section>
  <section class="sec" id="s-plan" hidden></section>
  <section class="sec" id="s-practice" hidden></section>
  <section class="sec" id="s-mock" hidden></section>
  <section class="sec" id="s-review" hidden></section>
  <section class="sec" id="s-tutor" hidden></section>
  <section class="sec" id="s-quiz" hidden></section>
  <section class="sec" id="s-result" hidden></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button class="tab on" data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button class="tab" data-go="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button class="tab" data-go="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>Practice</button>
  <button class="tab" data-go="mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="9" cy="8" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="9" cy="16" r="1.2"/><path d="M12 8h4M12 12h4M12 16h4"/></svg>Mock Test</button>
  <button class="tab" data-go="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.3"/><path d="M4 4v4h4"/></svg>Mistakes<span class="badge" id="miss-badge" hidden>0</span></button>
  <button class="tab" data-go="tutor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 10a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>Tutor</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
// ===== QUESTION ENGINE =====
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const nz = (a, b) => { let v; do { v = R(a, b); } while (v === 0); return v; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const round = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;
const fmtN = x => { const r = round(x, 4); return (r < 0 ? '−' : '') + Math.abs(r).toLocaleString('en-US', { maximumFractionDigits: 4 }); };
const sgn = x => x < 0 ? '−' : '+';
const money = x => '$' + x.toFixed(2);
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');

// fraction [n,d] reduced
function F(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
function fr(n, d) {
  [n, d] = F(n, d);
  if (d === 1) return fmtN(n);
  const neg = n < 0 ? '−' : '';
  return `${neg}<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
}
function mixed(n, d) {
  [n, d] = F(n, d);
  if (d === 1 || Math.abs(n) < d) return fr(n, d);
  const w = Math.trunc(n / d), r = Math.abs(n % d);
  return `${fmtN(w)} ${fr(r, d)}`;
}
// linear term helper: coef*x
function term(c, v = 'x', first = false) {
  if (c === 0) return '';
  const a = Math.abs(c), s = c < 0 ? '−' : '+';
  const body = (a === 1 ? '' : a) + v;
  if (first) return (c < 0 ? '−' : '') + body;
  return ` ${s} ${body}`;
}
function cterm(c, first = false) {
  if (c === 0) return first ? '0' : '';
  if (first) return fmtN(c);
  return ` ${sgn(c)} ${Math.abs(c)}`;
}
function lin(a, b, v = 'x') { // ax + b
  if (a === 0) return cterm(b, true);
  return term(a, v, true) + cterm(b);
}

// Build MC item: correct + distractors (strings, html). Ensures 4 unique.
function mc(correct, distractors, extra) {
  const seen = new Set([correct]); const opts = [correct];
  for (const d of distractors) { if (opts.length >= 4) break; if (d != null && !seen.has(d)) { seen.add(d); opts.push(d); } }
  let guard = 0;
  while (opts.length < 4 && guard++ < 50) { const d = extra ? extra() : String(R(1, 99)); if (!seen.has(d)) { seen.add(d); opts.push(d); } }
  const sh = shuffle(opts);
  return { opts: sh, ans: sh.indexOf(correct) };
}
const near = (v, f = fmtN) => () => f(v + nz(-5, 5));

const plain = h => String(h).replace(/<span class="fr"><span>(\d+)<\/span><span>(\d+)<\/span><\/span>/g, '($1/$2)').replace(/<br>/g, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function accPill(acc, n) {
  if (acc == null) return `<span class="pill p-new">New</span>`;
  const c = acc >= GOAL ? 'p-ok' : acc >= 70 ? 'p-warn' : 'p-bad';
  return `<span class="pill ${c}">${acc}%</span>`;
}
const accColor = a => a == null ? 'var(--line)' : a >= GOAL ? 'var(--ok)' : a >= 70 ? 'var(--warn)' : 'var(--bad)';
const fmtDate = (k, o = { weekday: 'short', month: 'short', day: 'numeric' }) => parseKey(k).toLocaleDateString('en-US', o);

let current = 'today';

}
let tabOf = 'practice';
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { if (quiz && current === 'quiz' && quiz.mock && quiz.i > 0 && !quiz.leaveOk) { quiz.leaveOk = true; toast('Mock test in progress. Tap again to leave (progress will be lost).'); return; } go(t.dataset.go); });

function header() {

  $('#countdown .l').innerHTML = n > 0 ? `day${n === 1 ? '' : 's'} to<br>Nov 20` : n === 0 ? 'Test<br>day' : 'Test<br>done';

function gaugeSVG(v) {
  const r = 70, c = Math.PI * r; const p = v == null ? 0 : Math.max(0, Math.min(100, v)) / 100;
  const goalA = Math.PI * (1 - GOAL / 100); const gx = 90 + r * Math.cos(goalA), gy = 90 - r * Math.sin(goalA);
  return `<svg viewBox="0 0 180 110" role="img" aria-label="Readiness ${v ?? 'not yet measured'} percent">
    <path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
    <path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="${accColor(v)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/>
    <line x1="${90 + (r - 12) * Math.cos(goalA)}" y1="${90 - (r - 12) * Math.sin(goalA)}" x2="${90 + (r + 12) * Math.cos(goalA)}" y2="${90 - (r + 12) * Math.sin(goalA)}" stroke="var(--gold)" stroke-width="4"/>
    <text x="${gx + 6}" y="${gy - 10}" class="sub" font-size="11">90</text>
    <text x="90" y="86" text-anchor="middle" class="big">${v == null ? '—' : v + '%'}</text>
    <text x="90" y="104" text-anchor="middle" class="sub">READINESS</text></svg>`;
}

    html += `</div>`;

function trendSVG() {
  const ms = S.mocks.slice(-12); if (ms.length < 2) return '';
  const W = 600, H = 170, pl = 34, pr = 12, pt = 14, pb = 26;
  const x = i => pl + i * (W - pl - pr) / (ms.length - 1), y = v => pt + (100 - v) * (H - pt - pb) / 100;
  const pts = ms.map((m, i) => `${x(i)},${y(m.pct)}`).join(' ');
  return `<div style="overflow-x:auto;margin-bottom:8px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto" role="img" aria-label="Mock test scores over time">
    ${[50, 70, 90, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 90 ? 'var(--gold)' : 'var(--line)'}" stroke-width="${v === 90 ? 2 : 1}" ${v === 90 ? 'stroke-dasharray="6 4"' : ''}/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="var(--band-2)" stroke-width="3" stroke-linejoin="round"/>
    ${ms.map((m, i) => `<circle cx="${x(i)}" cy="${y(m.pct)}" r="${i === ms.length - 1 ? 6 : 4}" fill="${accColor(m.pct)}"/>`).join('')}
    <text x="${W - pr}" y="${y(90) - 6}" text-anchor="end" font-size="11" fill="var(--muted)">goal 90%</text>
    <text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmtDate(ms[0].d, { month: 'short', day: 'numeric' })}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(ms[ms.length - 1].d, { month: 'short', day: 'numeric' })}</text>
  </svg></div>`;
}
function startMock(kind, plan) {

function renderReview() {

  if (!ms.length) { $('#s-review').innerHTML = `<div class="card empty"><b>No saved mistakes</b>Every question you miss lands here so you can fix it later. Right now the list is empty — nice.</div>`; return; }
  const byT = {}; ms.forEach(m => byT[m.topic] = (byT[m.topic] || 0) + 1);
  $('#s-review').innerHTML = `<div class="row" style="align-items:center;justify-content:space-between"><div><h2 style="font-size:30px">Mistakes to fix</h2><div style="color:var(--muted)">Answer one correctly and it leaves this list.</div></div>
      <button class="btn primary" onclick="startMistakes()">Redo all ${ms.length}</button></div>
    <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin:14px 0">${Object.entries(byT).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<button class="chip" onclick="startMistakes(null,'${t}')">${TOPICS[t].name} · ${n}</button>`).join('')}</div>
    <div class="card">${ms.slice(0, 40).map(m => `<div class="rv"><div class="h"><span class="pill p-bad">${TOPICS[m.topic].name}</span></div><div class="q" style="margin-top:6px">${m.q}</div><div class="a">Answer: <b>${m.opts[m.ans]}</b></div></div>`).join('')}</div>`;
}
function startMistakes(plan, topic) {
  if (current !== 'today' && current !== 'plan') tabOf = 'review';
  let items = Object.values(S.missed); if (topic) items = items.filter(m => m.topic === topic);
  items = shuffle(items).slice(0, 25).map(m => ({ ...m, opts: m.opts.slice(), retry: true }));
  // reshuffle choices so position isn't memorized
  items.forEach(it => { const c = it.opts[it.ans]; it.opts = shuffle(it.opts); it.ans = it.opts.indexOf(c); });
  startQuiz({ title: 'Fixing mistakes', items, plan });
}

// ===================== QUIZ ENGINE =====================
let quiz = null, tick = null;
function startQuiz(cfg) {
  if (!cfg.items.length) { toast('Nothing to practice here yet.'); return; }
  quiz = { ...cfg, i: 0, answers: [], start: Date.now(), picked: null, locked: false };
  go('quiz'); renderQ();
  clearInterval(tick); if (cfg.mock && S.timer) tick = setInterval(() => { const el = $('#clock'); if (el) el.textContent = clock(); }, 1000);
}
const clock = () => { const s = Math.floor((Date.now() - quiz.start) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function renderQ() {
  const q = quiz.items[quiz.i], N = quiz.items.length, ok = quiz.answers.filter(a => a.ok).length;
  $('#s-quiz').innerHTML = `
    <div class="qtop"><button class="btn ghost" style="min-height:44px;padding:8px 14px" onclick="quitQuiz()">✕ Exit</button>
      <span class="lbl">${esc(quiz.title)}</span>
      <span class="right">${quiz.mock && S.timer ? `<span class="chip num" id="clock">${clock()}</span>` : ''}${!quiz.mock ? `<span class="chip num">✓ ${ok}/${quiz.answers.length}</span>` : ''}</span></div>
    <div class="prog"><i style="width:${quiz.i / N * 100}%"></i></div>
    <div class="qcard">
      <div class="qnum"><span class="num">Question ${quiz.i + 1} of ${N}</span><span class="pill p-new">${TOPICS[q.topic].name}</span></div>
      <div class="qtext">${q.q}</div>
      <div class="opts" role="radiogroup">${q.opts.map((o, j) => `<button class="opt" role="radio" aria-checked="false" id="o${j}" onclick="choose(${j})"><span class="bub">${L[j]}</span><span class="ot">${o}</span></button>`).join('')}</div>
      <div id="fbx"></div>
      <div class="qactions" id="qact">${quiz.mock ? `<button class="btn primary" id="sub" disabled onclick="submitMock()">Submit answer</button>` : ''}</div>
    </div>
    <div id="quit-confirm"></div>`;
}
function choose(j) {
  if (quiz.locked) return;
  const q = quiz.items[quiz.i];
  if (quiz.mock) {
    quiz.picked = j;
    document.querySelectorAll('.opt').forEach((b, k) => { b.classList.toggle('sel', k === j); b.setAttribute('aria-checked', k === j); });
    $('#sub').disabled = false; return;
  }
  quiz.locked = true; const ok = j === q.ans;
  document.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (k === q.ans) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); });
  record(q, j, ok);
  const last = quiz.i + 1 >= quiz.items.length;
  $('#fbx').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? pick(['Correct!', 'Nice work!', 'Exactly right.', 'Yes!']) : 'Not this time'}</b>${ok ? '' : `The answer is <b>${L[q.ans]}: ${q.opts[q.ans]}</b>.<br>`}${q.exp}</div><div id="tut"></div>`;
  $('#qact').innerHTML = `${ok || !sampleFn ? '' : `<button class="btn ghost" id="askbtn" onclick="explain(${j})">Explain it another way</button>`}<button class="btn primary" onclick="nextQ()">${last ? 'See results' : 'Next question'}</button>`;
  save();
}
function submitMock() {
  if (quiz.picked == null) return;
  const q = quiz.items[quiz.i]; record(q, quiz.picked, quiz.picked === q.ans); quiz.picked = null; save(); nextQ();
}
function record(q, j, ok) {
  quiz.answers.push({ q, pick: j, ok });
  logAnswer(q.topic, ok);
  if (!ok) S.missed[q.id] = { id: q.id, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp, topic: q.topic, t: Date.now() };
  else if (q.retry) delete S.missed[q.id];
}
function nextQ() { quiz.i++; quiz.locked = false; if (quiz.i >= quiz.items.length) return finish(); renderQ(); }
function quitQuiz() {
  if (!quiz.answers.length) { clearInterval(tick); return go(tabOf === 'mock' ? 'mock' : tabOf); }
  $('#quit-confirm').innerHTML = `<div class="card confirm" style="margin-top:12px"><span>${quiz.mock ? 'Leave this mock test? It won’t be scored.' : 'Stop here? Your answers so far are saved.'}</span><button class="btn ghost" onclick="$('#quit-confirm').innerHTML=''">Keep going</button><button class="btn navy" onclick="clearInterval(tick);${quiz.mock ? `go('mock')` : 'finish()'}">${quiz.mock ? 'Leave test' : 'Finish now'}</button></div>`;
}

function finish() {
  clearInterval(tick);
  const A = quiz.answers, n = A.length, c = A.filter(a => a.ok).length, pct = n ? Math.round(c / n * 100) : 0, secs = Math.round((Date.now() - quiz.start) / 1000);
  if (quiz.mock) S.mocks.push({ d: todayKey(), kind: quiz.mock, n, c, pct, secs });
  const full = n >= Math.min(quiz.items.length, 10);
  if (quiz.plan && full) S.done[quiz.plan] = true;
  else if (!quiz.plan && full) { const p = planFor(todayKey()); if (p && p.type !== 'mock' && n >= 15) S.done[todayKey()] = true; }
  save(); header();
  const byT = {}; A.forEach(a => { const t = a.q.topic; byT[t] = byT[t] || [0, 0]; byT[t][0]++; byT[t][1] += a.ok; });
  const msg = pct >= GOAL ? ['Admission-level score!', 'That’s 90% or better. Keep it there on every mock test.'] : pct >= 75 ? ['Getting close', `You need about ${Math.ceil(GOAL / 100 * n) - c} more correct out of ${n} to hit 90%. Fix the misses below.`] : ['Good practice — keep going', 'Read each explanation below, then redo these in Mistakes.'];
  $('#s-result').innerHTML = `
    <div class="card"><div class="score-hero"><div class="pct num" style="color:${accColor(pct)}">${pct}%</div>
      <div class="msg"><h2 style="font-size:30px">${msg[0]}</h2><div style="color:var(--muted)">${esc(quiz.title)} · ${c} of ${n} correct${quiz.mock ? ` · ${Math.floor(secs / 60)} min ${secs % 60} s` : ''}</div><p style="margin:8px 0 0">${msg[1]}</p></div></div>
      <div class="qactions"><button class="btn primary" onclick="go('${tabOf === 'mock' ? 'mock' : 'today'}')">Done</button>${A.some(a => !a.ok) ? `<button class="btn ghost" onclick="startMistakes()">Redo mistakes now</button>` : ''}</div></div>
    <div class="eyebrow">By topic</div>
    <div class="topics">${Object.entries(byT).map(([t, [nn, cc]]) => { const a = Math.round(cc / nn * 100); return `<div class="tp"><span class="nm">${TOPICS[t].name}</span><div class="bar"><i style="width:${a}%;background:${accColor(a)}"></i></div><span class="meta"><span class="num">${cc}/${nn}</span>${accPill(a)}</span></div>`; }).join('')}</div>
    <div class="eyebrow">Review every question</div>
    <div class="card">${A.map((a, i) => `<div class="rv"><div class="h"><span class="pill ${a.ok ? 'p-ok' : 'p-bad'}">${a.ok ? '✓' : '✗'} ${i + 1}</span><div class="q">${a.q.q}</div></div>
      <div class="a">${a.ok ? `Your answer: <b>${L[a.pick]}: ${a.q.opts[a.pick]}</b>` : `You chose ${L[a.pick]}: ${a.q.opts[a.pick]} · Correct: <b>${L[a.q.ans]}: ${a.q.opts[a.q.ans]}</b>`}</div>
      ${a.ok && quiz.mock === undefined ? '' : `<div class="a" style="color:var(--ink-2)">${a.q.exp}</div>`}</div>`).join('')}</div>`;
  go('result');
}

// ===================== AI TUTOR =====================
let sampleFn; const sampleP = (async () => { try { sampleFn = window.claude && claude.use ? await claude.use('sample') : null; } catch (e) { sampleFn = null; } if (!sampleFn) { const t = document.querySelector('[data-go="tutor"]'); if (t) t.hidden = true; document.querySelector('.tabs .in').style.gridTemplateColumns = 'repeat(5,1fr)'; } return sampleFn; })();
const TUTOR_SYS = 'You are a warm, patient math tutor for Mahi, an 8th grader in New Jersey preparing for the ACCUPLACER math test (QAS, Arithmetic, AAF) on Nov 20 for admission to a Morris County vocational high school; she needs 90%+. Explain step by step with short numbered steps, plain language, and one quick tip to avoid the mistake. Use plain text math (like 3/4, x^2, sqrt(5)). No markdown headings or bold. Under 180 words.';
async function explain(j) {
  const q = quiz.items[quiz.i]; const out = $('#tut'); const b = $('#askbtn');
  const s = await sampleP;
  if (!s) { out.innerHTML = `<div class="tutor-out">The tutor isn't available in this view. Try opening the page while signed in to Claude.</div>`; return; }
  b.disabled = true; out.innerHTML = `<div class="tutor-out" id="tutxt">Thinking…</div>`;
  const prompt = `${TUTOR_SYS}\n\nQuestion: ${plain(q.q)}\nChoices: ${q.opts.map((o, k) => L[k] + ') ' + plain(o)).join('  ')}\nMahi chose ${L[j]}) ${plain(q.opts[j])}. Correct is ${L[q.ans]}) ${plain(q.opts[q.ans])}.\nExplain why the correct answer is right and what likely went wrong with her choice.`;
  try { await s(prompt, { modelTier: 'quick', onText: ({ text }) => { const el = $('#tutxt'); if (el) el.textContent = text; } }); }
  catch (e) { const el = $('#tutxt'); if (el) el.textContent = e && e.code === 'rate_limited' ? 'The tutor is busy. Try again in a minute.' : 'The tutor couldn’t answer right now. The explanation above still covers the steps.'; }
}
function renderTutor() {
  header();
  const chips = ['Percent increase vs decrease', 'Solving inequalities with negatives', 'Slope from two points', 'Systems of equations by elimination', 'Factoring x² + bx + c', 'Mean vs median', 'Probability without replacement', 'Pythagorean theorem word problems', 'Scientific notation', 'Negative exponents'];
  $('#s-tutor').innerHTML = `<h2 style="font-size:30px">Ask the tutor</h2><div style="color:var(--muted);margin-bottom:14px">Type any math question — or paste a problem from the study guide — and get step-by-step help.</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">${chips.map(c => `<button class="chip" onclick="$('#tq').value='Explain ${c.replace(/'/g, '')} with an example.';$('#tq').focus()">${c}</button>`).join('')}</div>
    <label for="tq" class="eyebrow" style="display:block;margin-top:0">Your question</label>
    <textarea id="tq" placeholder="Example: How do I solve 3(x − 4) = 2x + 5?"></textarea>
    <button class="btn primary wide" style="margin-top:10px" id="tqb" onclick="askTutor()">Ask</button>
    <div id="tqa"></div>`;
}
async function askTutor() {
  const v = ($('#tq').value || '').trim(); if (!v) return;
  const s = await sampleP; const out = $('#tqa');
  if (!s) { out.innerHTML = `<div class="tutor-out">The tutor isn't available in this view. Try opening the page while signed in to Claude.</div>`; return; }
  $('#tqb').disabled = true; out.innerHTML = `<div class="tutor-out" id="tqt">Thinking…</div>`;
  try { await s(`${TUTOR_SYS}\n\nMahi asks: ${v}`, { cache: false, onText: ({ text }) => { $('#tqt').textContent = text; } }); }
  catch (e) { $('#tqt').textContent = e && e.code === 'rate_limited' ? 'The tutor is busy. Try again in a minute.' : 'The tutor couldn’t answer right now. Please try again.'; }
  $('#tqb').disabled = false;
}

const R_ = { today: renderToday, plan: renderPlan, practice: renderPractice, mock: renderMock, review: renderReview, tutor: renderTutor };
function rerender() { if (R_[current]) R_[current](); header(); }
header(); renderToday();
</script>
